<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #70c5ce;
            margin: 0;
        }
        canvas {
            border: 2px solid #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="320" height="480"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let bird = { x: 50, y: 150, width: 20, height: 20, gravity: 0.5, lift: -10, velocity: 0 };
        let pipes = [];
        let frame = 0;
        let score = 0;
        let gameOver = false;

        document.addEventListener('keydown', () => {
            if (!gameOver) {
                bird.velocity += bird.lift;
            } else {
                resetGame();
            }
        });

        function resetGame() {
            bird.y = 150;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            frame = 0;
            gameOver = false;
        }

        function drawBird() {
            ctx.fillStyle = 'yellow';
            ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
        }

        function drawPipes() {
            ctx.fillStyle = 'green';
            pipes.forEach(pipe => {
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipe.width, pipe.bottom);
            });
        }

        function updatePipes() {
            if (frame % 90 === 0) {
                const top = Math.random() * (canvas.height / 2);
                const bottom = Math.random() * (canvas.height / 2);
                pipes.push({ x: canvas.width, width: 20, top: top, bottom: bottom });
            }

            pipes.forEach(pipe => {
                pipe.x -= 2;
            });

            if (pipes.length > 0 && pipes[0].x < -pipe.width) {
                pipes.shift();
                score++;
            }
        }

        function checkCollision() {
            if (bird.y + bird.height > canvas.height || bird.y < 0) {
                gameOver = true;
            }

            pipes.forEach(pipe => {
                if (
                    bird.x < pipe.x + pipe.width &&
                    bird.x + bird.width > pipe.x &&
                    (bird.y < pipe.top || bird.y + bird.height > canvas.height - pipe.bottom)
                ) {
                    gameOver = true;
                }
            });
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!gameOver) {
                bird.velocity += bird.gravity;
                bird.y += bird.velocity;

                drawBird();
                drawPipes();
                updatePipes();
                checkCollision();

                ctx.fillStyle = 'black';
                ctx.font = '16px Arial';
                ctx.fillText('Score: ' + score, 10, 20);
            } else {
                ctx.fillStyle = 'black';
                ctx.font = '32px Arial';
                ctx.fillText('Game Over', canvas.width / 6, canvas.height / 2);
                ctx.font = '16px Arial';
                ctx.fillText('Press any key to restart', canvas.width / 6, canvas.height / 2 + 30);
            }

            frame++;
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
